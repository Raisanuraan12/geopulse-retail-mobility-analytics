version: 2

sources:
  - name: geopulse_raw
    database: GEOPULSE_DB
    schema: RAW
    description: >
      Raw GPS ping and store join data landed from the ingestion pipeline.
      The GPS_PING_STORE_JOINS table is populated exclusively by
      write_joins_to_snowflake() in src/spatial/spatial_transform.py,
      called from the Airflow task run_spatial_transform after the
      Apache Sedona distributed spatial join completes.
    tables:
      - name: gps_ping_store_joins
        description: >
          Joined GPS ping-to-store records produced by the Sedona spatial
          transform step.  One row per (ping_id, store_id).
          Writer: write_joins_to_snowflake() in src/spatial/spatial_transform.py.
        columns:
          - name: ping_id
            description: >
              Synthetic monotonically-increasing ping identifier generated by
              Spark monotonically_increasing_id().  Not globally unique across
              pipeline runs; use (device_id, timestamp_raw, store_id) as a
              composite natural key when deduplication is required.
          - name: device_id
            description: "Anonymised device identifier (from raw GPS CSV)."
            tests:
              - not_null
          - name: store_id
            description: "Store identifier from the store locations config."
            tests:
              - not_null
          - name: store_name
            description: "Human-readable store name."
          - name: timestamp_raw
            description: "Raw ISO-8601 timestamp string from the GPS ping CSV."
          - name: h3_index
            description: "H3 cell ID at resolution 9 for the ping location."
          - name: distance_km
            description: >
              Great-circle distance in kilometres between the GPS ping location
              and the store centroid, computed by Sedona ST_DistanceSphere.
          - name: ingested_at
            description: "UTC timestamp when write_joins_to_snowflake() wrote the record."

models:
  - name: stg_gps_ping_store_joins
    description: >
      Staging view over the raw GPS ping-to-store joins table
      (GEOPULSE_DB.RAW.GPS_PING_STORE_JOINS).
      Applies type casting, null filtering, and column renaming
      to prepare data for mart consumption.
      Upstream written by: sedona_spatial_join_catchments() +
      write_joins_to_snowflake() in src/spatial/spatial_transform.py.
    columns:
      - name: ping_id
        description: >
          Cast ping identifier (NUMBER → bigint in Snowflake view).
          See source table description for uniqueness caveats.
      - name: device_id
        description: "Anonymised device identifier."
        tests:
          - not_null
      - name: store_id
        tests:
          - not_null
          - relationships:
              to: ref('dim_stores')
              field: store_id
      - name: store_name
        description: "Human-readable store name."
      - name: timestamp
        description: "Parsed NTZ timestamp of the GPS ping."
        tests:
          - not_null
      - name: h3_index
        description: "H3 hex cell ID (resolution 9)."
      - name: distance_km
        description: >
          Great-circle distance (km) between the ping and the matched store
          centroid.  Computed by Sedona ST_DistanceSphere (accurate sphere model).
      - name: ingested_at
        description: "UTC pipeline write timestamp."

  - name: fct_footfall_daily
    description: >
      Daily visit-level footfall fact table. One row per unique
      device-store-date combination. Includes dwell time and visit type.
    columns:
      - name: visit_key
        description: "Surrogate key: hash of device_id + store_id + visit_date."
        tests:
          - unique
          - not_null
      - name: store_id
        tests:
          - not_null
      - name: visit_date
        tests:
          - not_null
      - name: device_id
        tests:
          - not_null
      - name: visit_type
        tests:
          - accepted_values:
              values: ['pass_by', 'short_visit', 'long_visit']
